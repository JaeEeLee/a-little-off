<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light only" />
    <meta name="robots" content="noindex, nofollow" />
    <title>도슨트 · 조금 이상한 우리들</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;500;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/assets/css/docent.css" />
    <script src="/assets/js/console-greeting.js" defer></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <div class="wrap">
      <header>
        <p class="eyebrow">조금 이상한 우리들 · AUDIO GUIDE</p>
        <h1>도슨트</h1>
        <p class="lead">
          서문부터 에필로그까지 이어 듣거나,<br />작가 이름을 눌러 그 작품만 들을 수 있어요.<br />이어폰을 끼고 들어 주세요.
        </p>
        <button class="play-all" type="button" id="playAll">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4v16l13-8z" /></svg>
          처음부터 듣기
        </button>
      </header>

      <main id="list"></main>
      <button class="note-all" type="button" id="noteAll">✉ 참여 작가들에게 한마디 남기기</button>
      <p class="foot">조금 이상한 우리들 · Everyone Is a Little off<br />2026. 11. 12 – 11. 17 · 홍대 피시스 아카이브</p>
    </div>

    <div class="player" role="region" aria-label="도슨트 플레이어">
      <div class="player-in">
        <div class="now">
          <div style="min-width: 0">
            <span class="now-label" id="nowLabel">들을 작품을 골라 주세요</span>
            <span class="now-name" id="nowName">—</span>
          </div>
          <div class="now-actions">
            <button class="note-btn" type="button" id="noteBtn" hidden>✉ 한마디</button>
            <button class="speed" type="button" id="speed" aria-label="재생 속도">1×</button>
          </div>
        </div>
        <div class="seek">
          <span id="cur">0:00</span>
          <input type="range" id="bar" min="0" max="0" step="0.1" value="0" aria-label="재생 위치" />
          <span id="dur">0:00</span>
        </div>
        <div class="controls">
          <button class="ctl" type="button" id="prev" aria-label="이전 작품">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 5h2v14H6zM20 5v14L9 12z" /></svg>
          </button>
          <button class="ctl main" type="button" id="toggle" aria-label="재생">
            <svg viewBox="0 0 24 24" aria-hidden="true" id="iconPlay"><path fill="currentColor" d="M7 4v16l13-8z" /></svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" id="iconPause" hidden>
              <path fill="currentColor" d="M6 4h4v16H6zM14 4h4v16h-4z" />
            </svg>
          </button>
          <button class="ctl" type="button" id="next" aria-label="다음 작품">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg>
          </button>
        </div>
        <p class="hint" id="hint" role="status"></p>
      </div>
    </div>

    <audio id="audio" preload="metadata"></audio>

    <!-- 작가에게 한마디: 듣던 작품의 작가에게 바로 남긴다 (메인 페이지의 '작가에게 한마디'와 같은 시트로 간다) -->
    <div class="note-sheet" id="noteSheet" hidden>
      <div class="note-panel" role="dialog" aria-modal="true" aria-labelledby="noteTitle">
        <button class="note-close" type="button" id="noteClose" aria-label="닫기">×</button>
        <h2 class="note-title" id="noteTitle"></h2>
        <form id="noteForm" novalidate>
          <textarea id="noteMsg" maxlength="300" rows="5" placeholder="작품을 보고 느낀 점, 응원 한마디를 남겨 주세요."></textarea>
          <div class="note-row">
            <input id="noteFrom" type="text" maxlength="20" placeholder="보내는 사람 (비워도 돼요)" autocomplete="nickname" />
            <span class="note-count" id="noteCount">0 / 300</span>
          </div>
          <input class="note-trap" id="noteTrap" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <p class="note-privacy" id="notePrivacy"></p>
          <p class="note-status" id="noteStatus" role="status"></p>
          <button class="note-send" type="submit" id="noteSend">전하기</button>
        </form>
        <div class="note-done" id="noteDone" hidden>
          <p class="note-done-t">전해졌어요. 고마워요!</p>
          <p class="note-done-s" id="noteDoneSub"></p>
          <button class="note-send" type="button" id="noteDoneClose">닫기</button>
        </div>
      </div>
    </div>

    <script src="/assets/js/docent-tracks.js"></script>
    <script src="/assets/js/docent.js"></script>
    <script src="/assets/js/docent-note.js"></script>
    <script src="/assets/js/i18n.js"></script>
  </body>
</html>
