<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light only" />
    <meta name="robots" content="noindex, nofollow" />
    <title>작가님께 온 편지 · 조금 이상한 우리들</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/assets/css/letters.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <main class="wrap">
      <header class="head">
        <p class="eyebrow">조금 이상한 우리들 · 2026. 11. 12 – 17</p>
        <h1>작가님께 온 편지</h1>
      </header>

      <!-- 1. 이름 고르기 -->
      <section class="card" id="pick">
        <p class="lead">전시를 찾아온 분들이 남긴 마음을 모아 전해 드려요.<br />본인 이름을 골라 주세요.</p>
        <div class="names" id="names"></div>
      </section>

      <!-- 2. 편지 -->
      <section id="letter" hidden>
        <div class="sheet" id="sheet">
          <div class="sheet-head">
            <p class="to"><b id="toName"></b> 작가님께</p>
            <p class="count" id="count"></p>
          </div>
          <ol class="notes" id="mine"></ol>
          <div id="allWrap" hidden>
            <h2 class="sub">참여 작가 모두에게 남긴 글</h2>
            <ol class="notes" id="all"></ol>
          </div>
          <p class="closing" id="closing"></p>
        </div>
        <div class="actions">
          <p class="note">이미지로 저장하는 기능도 있지만, 휴대폰 기종에 따라 잘 안 될 수 있어요. <b>화면 캡처로 남기시는 걸 권해요.</b></p>
          <button type="button" class="primary" id="saveImg">이미지로 저장하기</button>
          <p class="msg" id="saveMsg" role="status"></p>
          <p class="note" id="until"></p>
          <button type="button" class="link" id="logout">← 뒤로가기</button>
        </div>
      </section>

      <p class="msg center" id="state" role="status"></p>

      <!-- 만든 이미지 모아 보기 -->
      <div class="gallery" id="gallery" hidden>
        <div class="gallery-in" role="dialog" aria-modal="true" aria-labelledby="galleryCount">
          <div class="gallery-top">
            <b id="galleryCount"></b>
            <button type="button" class="gallery-x" id="galleryClose" aria-label="닫기">×</button>
          </div>
          <p class="gallery-tip">휴대폰: 이미지를 <b>길게 눌러 '사진에 저장'</b>하거나, 아래 <b>모두 저장</b>을 눌러 주세요.</p>
          <div class="gallery-list" id="galleryList"></div>
          <div class="gallery-bottom">
            <button type="button" class="primary" id="galleryAll">모두 저장</button>
            <p class="msg" id="galleryMsg" role="status"></p>
          </div>
        </div>
      </div>
    </main>
    <script src="/assets/js/letters.js"></script>
  </body>
</html>
