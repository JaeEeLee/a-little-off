<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="light only" />
    <meta name="robots" content="noindex, nofollow" />
    <title>작가님께 온 편지 · 조금 이상한 우리들</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/assets/css/letters.css" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <button type="button" class="send-badge" id="sendBadge" aria-haspopup="dialog">✉ 쪽지 보내기</button>
    <div class="send-dlg" id="sendDlg" hidden role="dialog" aria-modal="true" aria-labelledby="sendTitle">
      <div class="send-box">
        <button type="button" class="send-x" data-close aria-label="닫기">✕</button>
        <h2 id="sendTitle">작가에게 쪽지 보내기</h2>
        <form id="sendForm" novalidate>
          <label
            >받는 작가
            <select name="to">
              <option value="">작가를 골라 주세요</option>
            </select>
          </label>
          <label
            >전할 말
            <textarea name="message" rows="5" maxlength="300" placeholder="작가님께 전하고 싶은 말을 적어 주세요"></textarea>
            <span class="send-len" id="sendLen">0 / 300</span>
          </label>
          <label
            >보내는 사람 <small>(비워 두면 익명)</small>
            <input name="sender" maxlength="20" autocomplete="nickname" />
          </label>
          <p class="send-state" id="sendState" role="status"></p>
          <button type="submit" class="primary" id="sendBtn">전하기</button>
        </form>
        <div class="send-done" id="sendDone" hidden>
          <p><b id="sendDoneTo"></b> 작가님께 쪽지를 전했어요.<br />곧 그 작가님 편지에 들어가요.</p>
          <button type="button" class="link" data-close>닫기</button>
        </div>
      </div>
    </div>
    <main class="wrap">
      <header class="head">
        <p class="eyebrow">조금 이상한 우리들 · 2026. 11. 12 – 17</p>
        <h1>작가님께 온 편지</h1>
      </header>

      <!-- 1. 이름 고르기 -->
      <section class="card" id="pick">
        <p class="lead">전시를 찾아온 분들이 남긴 마음을 모아 전해 드려요.<br />본인 이름을 골라 주세요.</p>
        <div class="names" id="names"></div>
      </section>

      <!-- 2. 편지 -->
      <section id="letter" hidden>
        <div class="sheet" id="sheet">
          <div class="sheet-head">
            <p class="to"><b id="toName"></b> 작가님께</p>
            <p class="count" id="count"></p>
          </div>
          <ol class="notes" id="mine"></ol>
          <div id="allWrap" hidden>
            <h2 class="sub">참여 작가 모두에게 남긴 글</h2>
            <ol class="notes" id="all"></ol>
          </div>
          <p class="closing" id="closing"></p>
        </div>
        <div class="actions">
          <p class="note">편지는 <b>화면 캡처로 남기시는 걸 권해요.</b> 글을 한 파일로 모아 두고 싶다면 PDF로도 저장할 수 있어요.</p>
          <button type="button" class="primary" id="savePdf">PDF로 저장하기</button>
          <p class="note tip" id="pdfTip"></p>
          <p class="note" id="until"></p>
          <button type="button" class="link" id="logout">← 뒤로가기</button>
        </div>
      </section>

      <p class="msg center" id="state" role="status"></p>
    </main>
    <script src="/assets/js/letters.js"></script>
  </body>
</html>
